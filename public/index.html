<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app draw edge to edge when launched from the home screen;
         SafeAreaProvider keeps content clear of the notch and home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Home-screen install (PWA): Android/Chrome reads the manifest (display: fullscreen). -->
    <link rel="manifest" href="/cgm-app-demo-MEDICA/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- iOS Safari "Add to Home Screen": opens without browser bars.

         No `apple-mobile-web-app-status-bar-style` here on purpose. With
         `black-translucent` the web view extends under the status bar, and
         iOS 26 then paints its Liquid Glass blur over the top ~40pt of our
         content - the haze that sat behind the view-mode and speed chips.
         Left unset, iOS keeps an opaque status bar (coloured from
         `theme-color`) above the web view, so nothing of ours is blurred.
         iOS reads these tags only when the icon is added to the Home screen:
         an existing install has to be removed and added again. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OHC CGM" />
    <link rel="apple-touch-icon" href="/cgm-app-demo-MEDICA/icons/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #ffffff;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
